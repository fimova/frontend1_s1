<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header>
        <div class="encabezado">
            <h1>Videojuegos Mibu</h1>
            <p>
                Descubre nuestra selección de videojuegos
                para distintas plataformas
            </p>
        </div>

        <nav class="navbar navbar-expand-lg">

            <div class="container-fluid">

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMibu"
                    aria-controls="navbarMibu" aria-expanded="false" aria-label="Abrir menú de navegación">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse justify-content-center" id="navbarMibu">

                    <div class="navbar-nav">
                        <a class="nav-link" href="../index.html">Inicio</a>
                        <a class="nav-link" href="../categorias/videojuegos.html">Videojuegos</a>
                        <a class="nav-link" href="../categorias/accesorios.html">Accesorios</a>
                        <a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a>
                    </div>

                </div>

            </div>

        </nav>

    </header>


    <main>

        <section class="contacto">

            <h2>Contacto</h2>

            <p>
                ¿Tienes alguna consulta? Escríbenos y te responderemos.
            </p>

            <form id="formContacto">

                <label for="nombre">Nombre:</label>

                <input type="text" id="nombre" name="nombre">


                <label for="correo">Correo:</label>

                <input type="text" id="correo" name="correo">


                <label for="mensaje">Mensaje:</label>

                <textarea id="mensaje" name="mensaje"></textarea>


                <button type="submit">
                    Enviar mensaje
                </button>

            </form>

            <p id="mensajeFormulario"></p>

        </section>

    </main>


    <footer class="pie">

        <span>Copyright © Mibu Ltda.</span>

        <a href="/sucursales">

        </a>

        <a href="/twitter">
